name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  zatca:
    name: ZATCA Phase 2 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: zatca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm ci
      - run: npm test
      - run: npm run example

  uae:
    name: UAE PINT AE + official Schematron
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uae-pint-ae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm test
      - run: npm run validate
