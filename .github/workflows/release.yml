# Publishes every package when a GitHub Release is published (tag vX.Y.Z):
#   npm:   @ifynx/zatca-phase2, @ifynx/uae-pint-ae   (trusted publishing, no token)
#   PyPI:  gulf-einvoicing                           (trusted publishing, no token)
# No long-lived secrets: both registries trust this workflow file through OIDC.
#   Packagist picks up the tag by itself (ifynx/gulf-e-invoicing).
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: [zatca, uae-pint-ae]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
        if: hashFiles(format('{0}/package-lock.json', matrix.package)) != ''
      - name: Publish (skipped when this version is already on npm)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do."
          else
            npm publish --access public
          fi

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
